<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system,'Apple SD Gothic Neo','Pretendard','Noto Sans KR',system-ui,sans-serif" role="img" aria-label="총 5.87달러 가운데 실습하는 동안의 컨트롤플레인 요금은 0.99달러입니다">
<style>.g0{opacity:0;animation:in0 14s ease-out infinite}@keyframes in0{0%,6%{opacity:0}12%,95%{opacity:1}100%{opacity:0}}.g1{opacity:0;animation:in1 14s ease-out infinite}@keyframes in1{0%,18%{opacity:0}24%,95%{opacity:1}100%{opacity:0}}.g2{opacity:0;animation:in2 14s ease-out infinite}@keyframes in2{0%,30%{opacity:0}36%,95%{opacity:1}100%{opacity:0}}.g3{opacity:0;animation:in3 14s ease-out infinite}@keyframes in3{0%,42%{opacity:0}48%,95%{opacity:1}100%{opacity:0}}.g4{opacity:0;animation:in4 14s ease-out infinite}@keyframes in4{0%,54%{opacity:0}60%,95%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.g0{animation:none;opacity:1}.g1{animation:none;opacity:1}.g2{animation:none;opacity:1}.g3{animation:none;opacity:1}.g4{animation:none;opacity:1}}</style>
