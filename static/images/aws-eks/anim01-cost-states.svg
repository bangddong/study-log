<rect class="clock" x="44" y="448" width="1032" height="4" rx="2" fill="#16202b"/>
<text x="44" y="480" font-size="12.5" fill="#5a6b7b">수치는 본문 단가표와 같습니다 · 작도는 AI 가 코드로 했습니다</text>
</svg>