<g class="s3"><rect x="776" y="38" width="300" height="40" rx="20" fill="#16202b"/><text x="926" y="64" font-size="15.5" font-weight="700" fill="#fff" text-anchor="middle">장면 3 / 3 · 클러스터를 destroy</text></g>
<text x="44" y="176" font-size="17" font-weight="700" fill="#16202b">EKS 컨트롤플레인</text>
<text x="44" y="200" font-size="13" fill="#5a6b7b">클러스터를 지워야만 멈춥니다</text>
