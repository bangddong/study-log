<g class="s3"><text x="900" y="236" font-size="50" font-weight="800" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#1d8102">$0</text><text x="900" y="266" font-size="13.5" fill="#5a6b7b">시간당</text><text x="900" y="318" font-size="14.5" font-weight="700" fill="#16202b">여기서야 멈춥니다</text></g>
